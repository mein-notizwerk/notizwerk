<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notizwerk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notizwerk">
<meta name="theme-color" content="#3b5bdb">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div id="topbar">
      <div class="pill" id="leftpill">
        <button data-act="nav" class="ic" title="Navigation ein-/ausblenden">☰</button>
        <button id="searchBox" data-act="search" title="Alle Notizen durchsuchen (⌘K)"><svg class="ico" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg><span id="nbLabel">Notizwerk</span></button>
      </div>
      <div class="pill" id="tabs">
        <button data-act="file" class="file">Datei</button>
        <button data-act="tab" data-tab="start" class="on">Start</button>
        <button data-act="tab" data-tab="insert">Einfügen</button>
        <button data-act="tab" data-tab="draw">Zeichnen</button>
        <button data-act="tab" data-tab="view">Ansicht</button>
      </div>
      <div class="pill" id="rightpill">
        <span id="saveState"></span>
        <button id="syncBtn" data-act="sync" title="Synchronisation und Einstellungen">☁ Sync</button>
        <button data-act="share" class="ic" title="Seite teilen"><svg class="ico" viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5"/><path d="M5 11v8.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V11"/></svg></button>
        <button data-act="theme" class="ic" title="Hell/Dunkel"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17Z" style="fill:currentColor"/></svg></button>
        <button data-act="focus" class="ic" title="Navigation ausblenden (Vollansicht)"><svg class="ico" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg></button>
      </div>
    </div>
    <div id="ribbon">
      <div class="rbfix">
        <button data-act="undo" class="ic" title="Rückgängig (Strg/⌘+Z)"><svg class="ico" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button data-act="redo" class="ic" title="Wiederholen (Strg/⌘+Umschalt+Z)"><svg class="ico" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        <span class="sep"></span>
      </div>
      <div class="rb" data-rb="start">
        <button data-act="para" title="Absatzformat">Absatz ▾</button>
        <span class="sep"></span>
        <button data-act="bold" title="Fett (Strg/⌘+B)"><b>F</b></button>
        <button data-act="italic" title="Kursiv (Strg/⌘+I)"><i>K</i></button>
        <button data-act="underline" title="Unterstrichen (Strg/⌘+U)"><u>U</u></button>
        <button data-act="strike" title="Durchgestrichen"><s>S</s></button>
        <button data-act="hilite" title="Hervorheben"><span class="ico-h">A</span></button>
        <button data-act="color" title="Textfarbe"><span class="ico-a">A</span></button>
        <button data-act="clear" title="Formatierung entfernen">⌫</button>
        <span class="sep"></span>
        <button data-act="ul" title="Aufzählung">• Liste</button>
        <button data-act="ol" title="Nummerierung">1. Liste</button>
        <span class="sep"></span>
        <button data-act="todo" title="Aufgabenliste">☑ Aufgabe</button>
        <button data-act="tag" title="Zeile markieren">★ Kategorien ▾</button>
        <span class="sep"></span>
        <button data-act="cloze" title="Markierten Text zur Lücke machen">Lücke</button>
        <button data-act="study" title="Lernmodus: Lücken verdecken">Abfragen</button>
        <button data-act="quiz" title="Alle Lücken und Abdeckungen dieses Abschnitts nacheinander abfragen">Abschnitt abfragen</button>
      </div>
      <div class="rb" data-rb="insert" hidden>
        <button data-act="table" title="Tabelle einfügen">▦ Tabelle</button>
        <button data-act="image" title="Bild einfügen">▣ Bild</button>
        <button data-act="pdf" title="PDF oder Vorlesungsfolien als Hintergrund einfügen – zum Draufschreiben">▤ PDF-Folien</button>
        <button data-act="attach" title="Datei, Foto oder PDF einfügen – bei Fotos und PDFs mit Auswahl: sichtbar oder nur als Link">📎 Datei</button>
        <button data-act="audio" title="Tonaufnahme starten/stoppen">● Aufnahme</button>
        <button data-act="formula" title="Formel in LaTeX-Schreibweise">∑ Formel</button>
        <span class="sep"></span>
        <button data-act="link" title="Weblink">Link</button>
        <button data-act="plink" title="Auf eine andere Seite verlinken (oder [[Titel]] tippen)">Seitenlink</button>
        <span class="sep"></span>
        <button data-act="ocr" title="Text in den Bildern dieser Seite erkennen, damit die Suche ihn findet">Texterkennung</button>
        <span class="sep"></span>
        <button data-act="newpage" title="Neue Seite (Alt+N)">+ Neue Seite</button>
      </div>
      <div class="rb" data-rb="draw" hidden>
        <div class="grp" id="drawbar"></div>
      </div>
      <div class="rb" data-rb="view" hidden>
        <button data-act="nav" title="Navigation ein-/ausblenden">☰ Navigation</button>
        <button data-act="paper" title="Seitenhintergrund">Hilfslinien ▾</button>
        <button data-act="theme" title="Hell/Dunkel">◐ Dunkler Modus</button>
        <span class="sep"></span>
        <button data-act="zoomout" title="Verkleinern">−</button>
        <button data-act="zoom0" id="zoomLbl" title="Zurück auf 100 %">100 %</button>
        <button data-act="zoomin" title="Vergrößern">+</button>
      </div>
    </div>
  </header>
  <div id="body">
    <nav id="nav">
      <button id="nbBtn"></button>
      <div class="cols">
        <div class="col"><div class="colhead">Abschnitte</div><div id="sections"></div><button class="add" id="addSec">+ Abschnitt</button></div>
        <div class="col"><div class="colhead">Seiten</div><div id="pages"></div><button class="add" id="addPage">+ Seite</button></div>
      </div>
    </nav>
    <main id="main">
      <div id="scroller">
        <div id="pagehead">
          <input id="title" placeholder="Unbenannte Seite" autocomplete="off">
          <div id="meta"></div>
        </div>
        <div id="zoombox"><div id="canvas"><svg id="ink"></svg></div></div>
        <div id="lockscreen"><p>🔒 Dieser Abschnitt ist gesperrt.</p><button class="primary" id="unlockBtn">Entsperren</button></div>
        <div id="backlinks"></div>
      </div>
    </main>
  </div>
</div>
<div id="overlay"></div>
<div id="toasts"></div>
<input type="file" id="imgFile" accept="image/*" multiple hidden>
<input type="file" id="pdfFile" accept="application/pdf,.pdf" hidden>
<input type="file" id="anyFile" multiple hidden>
<input type="file" id="jsonFile" accept=".json,application/json" hidden>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="extras.js"></script>
<script src="sync.js"></script>
</body>
</html>
